{% extends "base.html" %}
{% block content %}
<section class="intro">
  <h1>Welcome</h1>
  <p>Hi, I'm {{ site.author }}. {{ site.description }}</p>
</section>
<section class="post-list">
  <h2>Recent Posts</h2>
  <ul>
    {% for post in posts %}
    <li>
      <a href="{{ rel }}{{ post.url }}">{{ post.title }}</a>
      <time>{{ post.date.strftime("%Y-%m-%d") }}</time>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
